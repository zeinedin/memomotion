<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory XXL - Testing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1 class="title">MEMORY XXL</h1>
            <p class="subtitle">Sport & Movement Challenge</p>
            <p class="version">Testing Version - Jan 9, 2025</p>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="gamesPlayed">0</div>
                <div class="stat-label">Total Games</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="highScore">0</div>
                <div class="stat-label">High Score</div>
            </div>
        </div>

        <!-- Current Score (during game) -->
        <div class="current-score hidden" id="currentScoreCard">
            <div class="score-big" id="currentScore">0</div>
            <div class="score-label">Current Score</div>
        </div>

        <!-- Status -->
        <div class="status-card">
            <div class="status-item">
                <span class="status-dot" id="masterDot"></span>
                <span id="masterStatus">Master: Connecting...</span>
            </div>
            <div class="status-item">
                <span class="status-dot" id="tilesDot"></span>
                <span id="tilesStatus">Tiles: 0/0</span>
            </div>
        </div>

        <!-- Game Message -->
        <div class="game-message hidden" id="gameMessage">
            <div class="message-text" id="messageText">Ready to play!</div>
        </div>

        <!-- Progress Bar (during game) -->
        <div class="progress-container hidden" id="progressContainer">
            <div class="progress-label">
                <span id="progressText">Progress</span>
                <span id="progressNumbers">0/0</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button class="btn btn-primary" id="startBtn" disabled>
                START NEW GAME
            </button>
            <button class="btn btn-secondary" id="testBtn">
                Test Tiles
            </button>
        </div>

        <!-- Debug Info (toggle with 'd' key) -->
        <div class="debug-info hidden" id="debugInfo">
            <h3>Debug Info</h3>
            <div id="debugContent"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
