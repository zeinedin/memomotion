<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory XXL</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #111827; color: white; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* SCHERMEN */
        .screen { display: none; animation: fadeIn 0.5s; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* INPUTS */
        .card { background: #1F2937; padding: 30px; border-radius: 15px; margin-top: 20px; }
        input { padding: 15px; width: 80%; border-radius: 8px; border: none; font-size: 1.2rem; margin-bottom: 20px; }
        
        /* BUTTONS */
        .btn { padding: 15px 30px; font-size: 1.2rem; border: none; border-radius: 8px; cursor: pointer; color: white; margin: 5px; transition: 0.2s; }
        .btn-primary { background: linear-gradient(45deg, #EC4899, #8B5CF6); }
        .btn-secondary { background: #374151; }
        .btn:hover { transform: scale(1.05); }
        
        .lvl-btn { background: #374151; opacity: 0.6; }
        .lvl-btn.selected { opacity: 1; background: #8B5CF6; border: 2px solid white; }

        /* GAME GRID (Geen nummers!) */
        .grid { display: flex; justify-content: center; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .tile {
            width: 80px; height: 80px;
            background: #374151;
            border-radius: 12px;
            border: 3px solid #4B5563;
            /* Verberg Nummers */
            font-size: 0; 
            color: transparent;
            transition: 0.2s;
        }
        .tile.highlight { background: #EC4899; box-shadow: 0 0 20px #EC4899; transform: scale(1.1); }
        .tile.correct { background: #10B981; }
        .tile.wrong { background: #EF4444; }

        /* LEADERBOARD */
        table { width: 100%; text-align: left; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #374151; }
        th { color: #9CA3AF; }
        tr:first-child td { color: #FCD34D; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>MEMORY XXL</h1>

    <div id="screen-start" class="screen active">
        <div class="card">
            <h2>Join Game</h2>
            <input type="text" id="teamName" placeholder="Team Name">
            
            <div style="margin-bottom: 20px;">
                <button class="btn lvl-btn" onclick="selectLevel('Easy', this)">Easy</button>
                <button class="btn lvl-btn selected" onclick="selectLevel('Normal', this)">Normal</button>
                <button class="btn lvl-btn" onclick="selectLevel('Hard', this)">Hard</button>
            </div>

            <button class="btn btn-primary" onclick="registerTeam()">START GAME</button>
            <br><br>
            <button class="btn btn-secondary" onclick="loadLeaderboard()">🏆 Leaderboard</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <h3>Team: <span id="displayTeam"></span></h3>
        <h2 id="gameMessage">Wait for pattern...</h2>
        <div id="gameGrid" class="grid"></div>
        <br>
        <button class="btn btn-secondary" onclick="showScreen('screen-start')">Quit</button>
    </div>

    <div id="screen-leaderboard" class="screen">
        <div class="card">
            <h2>Top Scores</h2>
            <table id="lbTable">
                <thead><tr><th>#</th><th>Team</th><th>Score</th></tr></thead>
                <tbody></tbody>
            </table>
            <button class="btn btn-secondary" onclick="showScreen('screen-start')">Back</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
