<!DOCTYPE html>
<html>

<head>
    <title>Memory XXL Visualizer</title>
    <style>
        body {
            background: #222;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 600px;
            margin: 50px auto;
        }

        .tile {
            height: 100px;
            border-radius: 10px;
            background: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            border: 3px solid #666;
            transition: background 0.2s;
        }

        .active {
            background: #FFD700 !important;
            color: black;
            box-shadow: 0 0 20px #FFD700;
        }

        /* Yellow for Pattern */
        .correct {
            background: #00FF00 !important;
            color: black;
        }

        /* Green for Step */
        .wrong {
            background: #FF0000 !important;
            color: white;
        }

        /* Red for Error */
        #status {
            font-size: 20px;
            margin-top: 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <h1>Memory XXL Game Board</h1>
    <div id="status">Waiting for game start...</div>
    <div class="grid" id="grid">
    </div>

    <script>
        const ws = new WebSocket("ws://localhost:8000/ws/frontend");
        const grid = document.getElementById("grid");
        const status = document.getElementById("status");

        // Create 4 visual tiles (ID 1, 2, 3, 4)
        const tiles = {};
        [1, 2, 3, 4].forEach(id => {
            let div = document.createElement("div");
            div.className = "tile";
            div.innerText = "Tile " + id;
            div.id = "t" + id;
            grid.appendChild(div);
            tiles[id] = div;
        });

        ws.onmessage = async (event) => {
            const msg = JSON.parse(event.data);
            console.log(msg);

            if (msg.event === "show_pattern_web") {
                status.innerText = msg.data.message;
                const pattern = msg.data.pattern;

                // Animate the pattern
                for (let id of pattern) {
                    if (tiles[id]) {
                        tiles[id].classList.add("active");
                        await new Promise(r => setTimeout(r, 800)); // Wait 800ms
                        tiles[id].classList.remove("active");
                        await new Promise(r => setTimeout(r, 200)); // Pause
                    }
                }
                status.innerText = "YOUR TURN!";
            }
            else if (msg.event === "step_correct") {
                let t = tiles[msg.data.tile_id];
                if (t) {
                    t.classList.add("correct");
                    setTimeout(() => t.classList.remove("correct"), 500);
                }
            }
            else if (msg.event === "step_wrong") {
                let t = tiles[msg.data.tile_id];
                if (t) {
                    t.classList.add("wrong");
                    setTimeout(() => t.classList.remove("wrong"), 1000);
                }
                status.innerText = "GAME OVER";
            }
            else if (msg.event === "game_won") {
                status.innerText = "YOU WON! Press Master Button to play again.";
            }
        };
    </script>
</body>

</html>
