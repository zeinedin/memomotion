<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory XXL - 4-ESP Architecture</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* Additional styles for registration display */
        .registration-status {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 2px solid rgba(0, 255, 136, 0.3);
        }

        .registration-status h3 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 1.2rem;
            text-align: center;
        }

        .esp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .esp-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .esp-card.connected {
            border-color: rgba(0, 255, 136, 0.5);
        }

        .esp-card.disconnected {
            border-color: rgba(255, 68, 68, 0.5);
            opacity: 0.6;
        }

        .esp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .esp-id {
            font-weight: bold;
            font-size: 1.1rem;
            color: #00ff88;
        }

        .esp-status {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .esp-status.connected {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .esp-status.disconnected {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
        }

        .tile-indicators {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .tile-indicator {
            aspect-ratio: 1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .tile-indicator.registered {
            background: rgba(0, 255, 136, 0.3);
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .tile-indicator.not-registered {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.3);
        }

        .registration-progress {
            margin-top: 15px;
            text-align: center;
        }

        .progress-bar {
            height: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .registration-instructions {
            background: rgba(255, 136, 0, 0.1);
            border: 2px solid rgba(255, 136, 0, 0.5);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            color: #ffaa00;
            text-align: center;
        }

        .registration-instructions strong {
            color: #ff8800;
            font-size: 1.1rem;
        }

        .reset-registration-btn {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 2px solid #ff4444;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .reset-registration-btn:hover {
            background: rgba(255, 68, 68, 0.4);
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.5);
        }
    </style>
</head>

<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>
    </div>

    <!-- START SCREEN -->
    <div id="startScreen" class="screen active">
        <div class="container">
            <header class="hero">
                <div class="logo-container">
                    <div class="logo-glow"></div>
                    <h1 class="logo">MEMORY<span class="logo-xxl">XXL</span></h1>
                </div>
                <p class="tagline">🧠 Test Your Memory • 4-ESP Architecture 🎮</p>
            </header>

            <!-- Registration Status Section -->
            <div class="registration-status" id="registrationStatus">
                <h3>🔧 Tile Registration Status</h3>

                <div class="registration-instructions">
                    <strong>⚠️ Setup Required</strong><br>
                    Step on each tile to register it before playing!<br>
                    Tiles will flash <span style="color: #00aaff;">BLUE</span> when registered.
                </div>

                <div class="esp-grid" id="espGrid">
                    <!-- ESP cards will be dynamically added here -->
                </div>

                <div class="registration-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%;">
                            0/16
                        </div>
                    </div>
                    <button class="reset-registration-btn" id="resetRegistrationBtn">
                        🔄 Reset Registration
                    </button>
                </div>
            </div>

            <div class="card glass-card registration-card">
                <div class="card-header">
                    <span class="card-icon">👥</span>
                    <h2>Team Setup</h2>
                </div>

                <div class="form-group">
                    <label for="teamName">
                        <span class="label-icon">🏷️</span> Team Naam
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="teamName" placeholder="Enter your team name..." maxlength="20">
                        <span class="input-focus-effect"></span>
                    </div>
                    <span id="teamNameError" class="input-error" style="display: none;"></span>
                </div>

                <!-- System Status -->
                <div class="form-group">
                    <label>
                        <span class="label-icon">📡</span> System Status
                    </label>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <div class="status-badge" id="masterStatus">
                            <span class="status-dot disconnected"></span>
                            Master: Disconnected
                        </div>
                        <div class="status-badge" id="espStatus">
                            <span class="status-dot disconnected"></span>
                            ESPs: 0/4
                        </div>
                        <div class="status-badge" id="tileStatus">
                            <span class="status-dot disconnected"></span>
                            Tiles: 0/16
                        </div>
                    </div>
                </div>

                <button id="startGameBtn" class="btn-primary" disabled>
                    <span class="btn-shine"></span>
                    <span class="btn-text">🎮 Start Game</span>
                </button>

                <div style="text-align: center; margin-top: 10px; color: #ff8888;" id="startGameError"></div>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="screen">
        <div class="container">
            <!-- Game content here (reuse from original) -->
            <div class="game-header">
                <div class="score-display">
                    <span class="score-label">Score</span>
                    <span class="score-value" id="scoreDisplay">0</span>
                </div>
                <div class="round-display">
                    <span class="round-label">Round</span>
                    <span class="round-value" id="roundDisplay">1</span>
                </div>
            </div>

            <div class="game-message" id="gameMessage">
                Watch the pattern!
            </div>

            <div class="game-status" id="gameStatus">
                Waiting...
            </div>
        </div>
    </div>

    <script>
        // Version: 2.0 - Fixed array handling for Azure deployment
        console.log('Memory XXL 4-ESP v2.0 - Array handling fixed');

        // Registration management
        let registrationData = {
            tileEsps: [],
            tiles: [],
            summary: { connected_esps: 0, registered_tiles: 0, total_esps: 4, total_tiles: 16 }
        };

        // Game state
        let gameState = {
            score: 0,
            round: 0,
            isPlaying: false,
            patternLength: 0,
            currentProgress: 0
        };

        // WebSocket connection
        let socket = null;

        // Connect to backend
        function connectWebSocket() {
            // Use wss:// for HTTPS (Azure), ws:// for HTTP (local)
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/frontend`;

            console.log('🔌 Connecting to:', wsUrl);
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                console.log('✓ Connected to backend');
            };

            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                handleBackendMessage(msg);
            };

            socket.onclose = () => {
                console.log('✗ Disconnected from backend');
                setTimeout(connectWebSocket, 3000);
            };
        }

        function handleBackendMessage(msg) {
            const event = msg.event;
            const data = msg.data;

            console.log('Received event:', event, data);

            if (event === 'initial_state') {
                updateMasterStatus(data.master_connected);
                updateRegistrationDisplay(data);
            } else if (event === 'tile_status') {
                updateMasterStatus(data.master_connected);
                updateRegistrationDisplay(data);
            } else if (event === 'system_status') {
                updateRegistrationDisplay(data);
            } else if (event === 'master_status') {
                updateMasterStatus(data.connected);
            } else if (event === 'registration_reset') {
                alert(data.message);
            } else if (event === 'error') {
                document.getElementById('startGameError').textContent = data.message;
                updateGameMessage(data.message, '❌');
            } else if (event === 'game_started') {
                handleGameStarted(data);
            } else if (event === 'pattern_complete') {
                handlePatternComplete(data);
            } else if (event === 'player_turn') {
                handlePlayerTurn(data);
            } else if (event === 'step_correct') {
                handleStepCorrect(data);
            } else if (event === 'step_incorrect') {
                handleStepIncorrect(data);
            } else if (event === 'round_complete') {
                handleRoundComplete(data);
            } else if (event === 'new_round') {
                handleNewRound(data);
            } else if (event === 'game_ended') {
                handleGameEnded(data);
            }
        }

        function updateMasterStatus(connected) {
            const masterStatus = document.getElementById('masterStatus');
            const dot = masterStatus.querySelector('.status-dot');

            if (connected) {
                masterStatus.innerHTML = '<span class="status-dot connected"></span>Master: Connected';
            } else {
                masterStatus.innerHTML = '<span class="status-dot disconnected"></span>Master: Disconnected';
            }
        }

        function updateRegistrationDisplay(data) {
            registrationData = data;

            // Convert tiles object to array if needed
            let tilesArray = [];
            if (data.tiles) {
                if (Array.isArray(data.tiles)) {
                    tilesArray = data.tiles;
                } else {
                    // Convert object {1: {connected: true}, 2: {...}} to array
                    tilesArray = Object.keys(data.tiles).map(id => ({
                        id: parseInt(id),
                        connected: data.tiles[id].connected,
                        registered: data.tiles[id].connected // Assume connected tiles are registered
                    }));
                }
            }

            // Convert tile_esps to array if needed (or empty if master disconnected)
            let espArray = [];
            if (data.tile_esps && data.master_connected !== false) {
                if (Array.isArray(data.tile_esps)) {
                    espArray = data.tile_esps;
                } else {
                    espArray = Object.values(data.tile_esps);
                }
            }

            // Update ESP status
            const espStatus = document.getElementById('espStatus');
            const connectedEsps = espArray.filter(e => e.connected).length;
            espStatus.innerHTML = `<span class="status-dot ${connectedEsps > 0 ? 'connected' : 'disconnected'}"></span>ESPs: ${connectedEsps}/4`;

            // Update tile status
            const registeredTiles = tilesArray.filter(t => t.connected || t.registered).length;
            const tileStatus = document.getElementById('tileStatus');
            tileStatus.innerHTML = `<span class="status-dot ${registeredTiles > 0 ? 'connected' : 'disconnected'}"></span>Tiles: ${registeredTiles}/16`;

            // Update ESP grid
            const espGrid = document.getElementById('espGrid');
            espGrid.innerHTML = '';

            for (let espId = 1; espId <= 4; espId++) {
                const espData = espArray.find(e => e.id === espId || e.esp_id === espId);
                const isConnected = espData && espData.connected;

                const espCard = document.createElement('div');
                espCard.className = `esp-card ${isConnected ? 'connected' : 'disconnected'}`;

                const espHeader = document.createElement('div');
                espHeader.className = 'esp-header';
                espHeader.innerHTML = `
                    <span class="esp-id">ESP #${espId}</span>
                    <span class="esp-status ${isConnected ? 'connected' : 'disconnected'}">
                        ${isConnected ? '✓ Online' : '✗ Offline'}
                    </span>
                `;

                const tileIndicators = document.createElement('div');
                tileIndicators.className = 'tile-indicators';

                // Tiles for this ESP (e.g., ESP1 = 1-4, ESP2 = 5-8, etc.)
                const startTile = (espId - 1) * 4 + 1;
                for (let i = 0; i < 4; i++) {
                    const tileId = startTile + i;
                    const tileData = tilesArray.find(t => t.id === tileId);
                    const isRegistered = tileData && (tileData.connected || tileData.registered);

                    const tileIndicator = document.createElement('div');
                    tileIndicator.className = `tile-indicator ${isRegistered ? 'registered' : 'not-registered'}`;
                    tileIndicator.textContent = tileId;
                    tileIndicator.title = `Tile ${tileId} - ${isRegistered ? 'Registered' : 'Not Registered'}`;

                    tileIndicators.appendChild(tileIndicator);
                }

                espCard.appendChild(espHeader);
                espCard.appendChild(tileIndicators);
                espGrid.appendChild(espCard);
            }

            // Update progress bar
            const percentage = (registeredTiles / 16) * 100;
            const progressFill = document.getElementById('progressFill');
            progressFill.style.width = `${percentage}%`;
            progressFill.textContent = `${registeredTiles}/16`;

            // Enable/disable start button
            const startBtn = document.getElementById('startGameBtn');
            const startError = document.getElementById('startGameError');

            if (connectedEsps === 0) {
                startBtn.disabled = true;
                startError.textContent = 'No ESPs connected';
            } else if (registeredTiles < 2) {
                startBtn.disabled = true;
                startError.textContent = `Need at least 2 registered tiles (${registeredTiles}/16)`;
            } else {
                startBtn.disabled = false;
                startError.textContent = '';
            }
        }

        // Event listeners
        document.getElementById('resetRegistrationBtn').addEventListener('click', () => {
            if (confirm('Reset all tile registrations? You will need to step on each tile again.')) {
                socket.send(JSON.stringify({ event: 'reset_registration' }));
            }
        });

        document.getElementById('startGameBtn').addEventListener('click', () => {
            const teamName = document.getElementById('teamName').value.trim();
            if (!teamName) {
                document.getElementById('startGameError').textContent = 'Please enter a team name';
                return;
            }

            gameState = {
                score: 0,
                round: 0,
                isPlaying: true,
                patternLength: 0,
                currentProgress: 0
            };

            socket.send(JSON.stringify({ event: 'start_game', data: { team_name: teamName } }));
            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
        });

        // Game event handlers
        function handleGameStarted(data) {
            gameState.isPlaying = true;
            gameState.round = 1;
            gameState.patternLength = data.pattern_length;
            updateGameDisplay();
            updateGameMessage(data.message || 'Watch the pattern!', '👀');
        }

        function handlePatternComplete(data) {
            updateGameMessage(data.message || 'Pattern shown - Your turn!', '🎯');
        }

        function handlePlayerTurn(data) {
            gameState.patternLength = data.pattern_length;
            gameState.currentProgress = 0;
            updateGameMessage(data.message || 'Your turn! Step on the tiles', '👣');
        }

        function handleStepCorrect(data) {
            gameState.score = data.score;
            gameState.currentProgress = data.progress;
            updateGameDisplay();
            updateGameMessage(`Correct! (${data.progress}/${data.total})`, '✅');
        }

        function handleStepIncorrect(data) {
            gameState.score = data.score;
            updateGameDisplay();
            updateGameMessage(`Wrong! Expected tile ${data.expected}`, '❌');
        }

        function handleRoundComplete(data) {
            gameState.score = data.score;
            gameState.round++;
            updateGameDisplay();
            updateGameMessage(data.message || 'Round complete!', '🎉');
        }

        function handleNewRound(data) {
            gameState.patternLength = data.pattern_length;
            updateGameDisplay();
            updateGameMessage(data.message || 'Watch the new pattern!', '👀');
        }

        function handleGameEnded(data) {
            gameState.isPlaying = false;
            gameState.score = data.score;
            updateGameDisplay();
            updateGameMessage(`Game Over! Final Score: ${data.score}`, '🏁');

            setTimeout(() => {
                if (confirm(`Game Over! Score: ${data.score}\n\nPlay again?`)) {
                    document.getElementById('gameScreen').classList.remove('active');
                    document.getElementById('startScreen').classList.add('active');
                } else {
                    document.getElementById('gameScreen').classList.remove('active');
                    document.getElementById('startScreen').classList.add('active');
                }
            }, 2000);
        }

        function updateGameDisplay() {
            document.getElementById('scoreDisplay').textContent = gameState.score;
            document.getElementById('roundDisplay').textContent = gameState.round;
        }

        function updateGameMessage(message, icon = '💡') {
            const gameMessage = document.getElementById('gameMessage');
            gameMessage.textContent = `${icon} ${message}`;
        }

        // Initialize
        connectWebSocket();

        // Status badge styles
        const style = document.createElement('style');
        style.textContent = `
            .status-badge {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 12px;
                background: rgba(0, 0, 0, 0.3);
                border-radius: 8px;
                border: 2px solid rgba(255, 255, 255, 0.1);
                font-size: 0.9rem;
            }

            .status-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                display: inline-block;
            }

            .status-dot.connected {
                background: #00ff88;
                box-shadow: 0 0 10px #00ff88;
            }

            .status-dot.disconnected {
                background: #ff4444;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>

</html>
